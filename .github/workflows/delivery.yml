# Delivery: builds, scans and pushes ghcr.io/privacybydesign/go-passport-issuer.
# Push to main -> :edge, release vX.Y.Z -> :X.Y.Z and :latest. PR builds are
# scanned in Status checks; published images are re-scanned weekly by
# image-rescan.yml.
name: Delivery

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    # Releases like libpassportreader-YYYYMMDD only carry a library, not an image.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      # The old Delivery tagged :latest on every stable release; keep doing so.
      tag-latest: true
    secrets:
      # Public Cloudflare Turnstile site key, baked into the frontend bundle.
      DOCKER_BUILD_ARGS: TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
