basePath: /api
definitions:
  analytics.Client:
    properties:
      app_version:
        type: string
      flavor:
        type: string
      platform:
        type: string
    type: object
  main.FaceCaptureConfigResponse:
    properties:
      face_api_url:
        description: Browser-reachable origin of the Regula Face API
        example: https://faceapi.staging.yivi.app
        type: string
    type: object
  main.FaceMatchResult:
    properties:
      matched:
        description: True if the document portrait and live face match above the similarity
          threshold
        example: true
        type: boolean
      similarity:
        description: Similarity score between the document portrait and live face
        example: 0.92
        type: number
    type: object
  main.FaceMethod:
    enum:
    - regula
    - iris
    type: string
    x-enum-varnames:
    - MethodRegula
    - MethodIris
  main.FaceSessionAnnouncement:
    properties:
      expires_in:
        description: Seconds until the session expires when streaming has not started
        example: 600
        type: integer
      face_session_id:
        example: fs_1a2b3c
        type: string
      stream_url:
        description: WebSocket endpoint of the verifier's stream for this session
        example: wss://iris-verifier.staging.yivi.app/stream/fs_1a2b3c
        type: string
      token:
        description: Presented by the wallet as the first message on the stream
        type: string
    type: object
  main.FaceVerificationAnnouncement:
    properties:
      face_api_url:
        description: |-
          Browser/app-reachable origin of the Regula Face API the liveness session
          must run against — the same service this issuer matches against. Present
          for the regula method only.
        example: https://faceapi.staging.yivi.app
        type: string
      method:
        allOf:
        - $ref: '#/definitions/main.FaceMethod'
        description: |-
          The face verification method assigned to this session: regula or iris.
          Wallets from before methods existed ignore it and run Regula, which is
          the only method they are ever assigned.
        example: regula
    type: object
  main.FaceVerificationDeclaration:
    properties:
      attempt:
        description: 'Set on a retry: the number of this attempt, starting at 2.'
        type: integer
      capabilities:
        description: |-
          Wire names of the methods this build can run. Absent or empty means
          ["regula"], the only method those wallets support. Unknown names are
          ignored.
        items:
          type: string
        type: array
      preferred_method:
        description: A tester's preference, honoured only when allow_client_preference
          is on.
        type: string
      previous_method:
        description: 'Set on a retry within one document flow: the method assigned
          last time.'
        type: string
    type: object
  main.HealthResponse:
    properties:
      ok:
        description: True if the service is healthy
        example: true
        type: boolean
    type: object
  main.IssuanceResponse:
    properties:
      irma_server_url:
        description: URL of the IRMA server for credential issuance
        example: https://irma.example.com
        type: string
      jwt:
        description: Signed JWT containing the IRMA issuance request
        example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  main.StartValidationRequest:
    properties:
      client:
        allOf:
        - $ref: '#/definitions/analytics.Client'
        description: Coarse labels of the wallet build, for the recordings only.
      face_verification:
        $ref: '#/definitions/main.FaceVerificationDeclaration'
    type: object
  main.ValidatePassportResponse:
    properties:
      face_verification:
        allOf:
        - $ref: '#/definitions/main.FaceVerificationAnnouncement'
        description: |-
          Present iff face verification is enabled for this environment. Absent
          means the app skips the face verification step.
      nonce:
        description: Random nonce for active authentication (16 hex characters)
        example: 1234567890abcdef
        type: string
      session_id:
        description: Unique session identifier (32 hex characters)
        example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
        type: string
    type: object
  main.VerificationResponse:
    properties:
      authentic_chip:
        description: True if active authentication (chip challenge-response) succeeded
        example: true
        type: boolean
      authentic_content:
        description: True if passive authentication (signature verification) succeeded
        example: true
        type: boolean
      face_match:
        allOf:
        - $ref: '#/definitions/main.FaceMatchResult'
        description: Optional face verification result
      face_session:
        allOf:
        - $ref: '#/definitions/main.FaceSessionAnnouncement'
        description: |-
          The Iris face session opened for this document; present only when the
          session's assigned face verification method is iris
      is_expired:
        description: True if the document has expired
        example: false
        type: boolean
    type: object
  models.ValidationRequest:
    properties:
      aa_signature:
        description: Hex-encoded active authentication signature (optional)
        example: 304502...
        type: string
      data_groups:
        additionalProperties:
          type: string
        description: Map of data group identifiers to hex-encoded data group contents
        type: object
      ef_sod:
        description: Hex-encoded Security Object (EF.SOD) containing document signature
        example: 778201ab...
        type: string
      face_attempt:
        description: |-
          Which attempt at the face verification step this issuance follows within
          the wallet's document flow, starting at 1. Recording only (optional).
        example: 1
        type: integer
      face_duration_ms:
        description: |-
          Milliseconds from the user confirming the face verification intro to the
          evidence being in hand. Recording only (optional).
        example: 4200
        type: integer
      face_session_id:
        description: |-
          Identifier of the Iris face session the issuer opened at verification.
          Required at issuance when the session's assigned face verification
          method is iris; the issuer pulls the verdict for it (optional).
        example: fs_1a2b3c
        type: string
      liveness_transaction_id:
        description: |-
          Identifier of a completed Regula liveness transaction. The live face
          captured during that session is compared against the document chip
          portrait for face verification (optional).
        example: a1b2c3d4-5678-90ab-cdef-1234567890ab
        type: string
      nonce:
        description: Nonce obtained from /start-validation
        example: 1234567890abcdef
        type: string
      session_id:
        description: Session ID obtained from /start-validation
        example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
        type: string
    type: object
info:
  contact:
    name: Privacy by Design Foundation
  description: |-
    API for verifying and issuing digital credentials from travel documents (passports, ID cards, and driving licences).
    This service validates MRTD (Machine Readable Travel Documents) and Electronic Driving Licences (EDL), then issues privacy-preserving credentials through the IRMA framework.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Go Passport Issuer API
  version: "1.0"
paths:
  /face-capture-config:
    get:
      description: Returns the browser-reachable Regula Face API origin used by the
        /capture liveness page. The page runs the liveness session directly against
        that service, the same way the native Regula SDK does in the Play Store and
        App Store builds; only the resulting transaction ID is passed back to the
        app. Responds 404 when face verification is disabled, so the capture page
        cannot run liveness sessions no issuance will consume.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.FaceCaptureConfigResponse'
        "404":
          description: face capture not configured
          schema:
            type: string
      summary: Face capture page configuration
      tags:
      - Face Verification
  /health:
    get:
      description: Returns the health status of the API service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: Health check
      tags:
      - Health
  /issue-driving-licence:
    post:
      consumes:
      - application/json
      description: 'Verifies the Electronic Driving Licence (EDL) and issues an IRMA
        credential. Returns a JWT that can be used with the IRMA server to obtain
        the credential. Passive authentication (SOD signature) is always mandatory.
        Active authentication (chip challenge-response) is mandatory when the chip
        supports it: if the chip carries an AA public key (DG13) the request must
        include a valid nonce and aa_signature, otherwise issuance is rejected with
        400.'
      parameters:
      - description: Validation request with document data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ValidationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.IssuanceResponse'
        "400":
          description: invalid request
          schema:
            type: string
        "500":
          description: error:internal
          schema:
            type: string
      summary: Verify and issue driving licence credential
      tags:
      - Driving Licence
  /issue-id-card:
    post:
      consumes:
      - application/json
      description: 'Verifies the ID card and issues an IRMA credential. Returns a
        JWT that can be used with the IRMA server to obtain the credential. Passive
        authentication (SOD signature) is always mandatory. Active authentication
        (chip challenge-response) is mandatory when the chip supports it: if the chip
        carries an AA public key (DG15) the request must include a valid nonce and
        aa_signature, otherwise issuance is rejected with 400.'
      parameters:
      - description: Validation request with document data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ValidationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.IssuanceResponse'
        "400":
          description: invalid request
          schema:
            type: string
        "500":
          description: error:internal
          schema:
            type: string
      summary: Verify and issue ID card credential
      tags:
      - ID Card
  /issue-passport:
    post:
      consumes:
      - application/json
      description: 'Verifies the passport and issues an IRMA credential. Returns a
        JWT that can be used with the IRMA server to obtain the credential. Passive
        authentication (SOD signature) is always mandatory. Active authentication
        (chip challenge-response) is mandatory when the chip supports it: if the chip
        carries an AA public key (DG15) the request must include a valid nonce and
        aa_signature, otherwise issuance is rejected with 400.'
      parameters:
      - description: Validation request with document data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ValidationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.IssuanceResponse'
        "400":
          description: invalid request
          schema:
            type: string
        "500":
          description: error:internal
          schema:
            type: string
      summary: Verify and issue passport credential
      tags:
      - Passport
  /start-validation:
    post:
      consumes:
      - application/json
      description: 'Initializes a new validation session and generates a nonce for
        active authentication. The nonce should be used to perform active authentication
        on the document chip. The session ID and nonce must be included in subsequent
        verification/issuance requests. The body is optional: a wallet may declare
        which face verification methods it can run (and, on a retry, which it was
        assigned before); no body means Regula only. When face verification is enabled
        for this environment, the response carries a face_verification object naming
        the assigned method and, for regula, the Face API the liveness session must
        run against; the app skips the face verification step when the object is absent.
        Responds 400 when none of the wallet''s methods is enabled here.'
      parameters:
      - description: Optional capability declaration
        in: body
        name: request
        schema:
          $ref: '#/definitions/main.StartValidationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ValidatePassportResponse'
        "400":
          description: 'face verification required: please update the Yivi app'
          schema:
            type: string
        "500":
          description: error:internal
          schema:
            type: string
      summary: Start document validation session
      tags:
      - Session
  /verify-driving-licence:
    post:
      consumes:
      - application/json
      description: Verifies the authenticity of an Electronic Driving Licence (EDL)
        without issuing credentials. Performs both passive authentication (signature
        verification) and active authentication (chip challenge-response) if signature
        is provided.
      parameters:
      - description: Validation request with document data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ValidationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.VerificationResponse'
        "400":
          description: invalid request
          schema:
            type: string
        "500":
          description: error:internal
          schema:
            type: string
      summary: Verify driving licence authenticity
      tags:
      - Driving Licence
  /verify-passport:
    post:
      consumes:
      - application/json
      description: Verifies the authenticity of a passport without issuing credentials.
        Performs both passive authentication (signature verification) and active authentication
        (chip challenge-response) if signature is provided.
      parameters:
      - description: Validation request with document data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ValidationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.VerificationResponse'
        "400":
          description: invalid request
          schema:
            type: string
        "500":
          description: error:internal
          schema:
            type: string
      summary: Verify passport authenticity
      tags:
      - Passport
swagger: "2.0"
